<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprehension Master - Simulador de Call Center</title>
    
    <!-- Carga automática de la base de datos externa local -->
    <script src="scenarios.js"></script>
    
    <!-- Librerías Externas de UI -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .cursor-help { cursor: help; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icon = ({ name, className }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} className={className}></i>;
        };

        const App = () => {
            const [gameState, setGameState] = useState('menu'); 
            const [gameMode, setGameMode] = useState('normal'); 
            const [currentScenario, setCurrentScenario] = useState(null);
            const [currentStep, setCurrentStep] = useState(0);
            const [chatHistory, setChatHistory] = useState([]);
            const [score, setScore] = useState(0);
            const [maxPossibleScore, setMaxPossibleScore] = useState(0);
            const [feedback, setFeedback] = useState(null);
            const [shuffledOptions, setShuffledOptions] = useState([]);
            const [filter, setFilter] = useState('All');
            const [vocabularyLog, setVocabularyLog] = useState([]);
            const [activeWord, setActiveWord] = useState(null);
            
            const [timeLeft, setTimeLeft] = useState(15);
            const timerRef = useRef(null);
            const chatEndRef = useRef(null);

            const speakText = (text) => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'en-US';
                    const voices = window.speechSynthesis.getVoices();
                    const enVoice = voices.find(v => v.lang.startsWith('en-US') || v.lang.startsWith('en-GB'));
                    if (enVoice) utterance.voice = enVoice;
                    utterance.rate = 0.95; 
                    window.speechSynthesis.speak(utterance);
                }
            };

            useEffect(() => {
                if (gameState === 'playing' && gameMode === 'timeAttack' && !feedback) {
                    setTimeLeft(15);
                    timerRef.current = setInterval(() => {
                        setTimeLeft((prev) => {
                            if (prev <= 1) {
                                clearInterval(timerRef.current);
                                handleTimeOut();
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(timerRef.current);
            }, [currentStep, gameState, feedback, gameMode]);

            useEffect(() => { 
                if (gameState === 'playing') chatEndRef.current?.scrollIntoView({ behavior: "smooth" }); 
            }, [chatHistory, feedback]);

            const handleTimeOut = () => {
                setScore((prev) => Math.max(0, prev - 5));
                setChatHistory(prev => [...prev, { type: 'system', text: "AHT LIMIT BROKEN: Response SLA threshold breached. Customer satisfaction dropping." }]);
                setFeedback({ points: 0, message: "AHT Exceeded! You took more than 15 seconds to evaluate the response strategy. (-5 Logic Points)" });

                setTimeout(() => {
                    setFeedback(null);
                    advanceStep();
                }, 4500);
            };

            const startScenario = (scenario, mode) => {
                if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                
                setGameMode(mode);
                setCurrentScenario(scenario);
                setCurrentStep(0);
                setScore(0);
                setMaxPossibleScore(scenario.steps.length * 10);
                setFeedback(null);
                setVocabularyLog([]);
                setGameState('playing');

                const firstText = scenario.steps[0].customer;
                setChatHistory([{ type: 'customer', text: firstText }]);
                setShuffledOptions([...scenario.steps[0].options].sort(() => Math.random() - 0.5));

                if (mode !== 'timeAttack') {
                    setTimeout(() => speakText(firstText), 300);
                }
            };

            const handleOptionClick = (option) => {
                if (feedback) return;
                if (timerRef.current) clearInterval(timerRef.current);
                if ('speechSynthesis' in window) window.speechSynthesis.cancel();

                setChatHistory([...chatHistory, { type: 'agent', text: option.text }]);
                setScore(score + option.points);
                setFeedback({ points: option.points, message: option.feedback });
                
                setTimeout(() => {
                    setFeedback(null);
                    advanceStep();
                }, 4500); 
            };

            const advanceStep = () => {
                const nextStep = currentStep + 1;
                if (nextStep < currentScenario.steps.length) {
                    setCurrentStep(nextStep);
                    const nextText = currentScenario.steps[nextStep].customer;
                    setChatHistory(prev => [...prev, { type: 'customer', text: nextText }]);
                    setShuffledOptions([...currentScenario.steps[nextStep].options].sort(() => Math.random() - 0.5));
                    
                    if (gameMode !== 'timeAttack') speakText(nextText);
                } else { 
                    setGameState('results'); 
                }
            };

            const renderInteractiveText = (text) => {
                if (gameMode === 'ghostCall') {
                    return (
                        <div className="flex items-center gap-2 text-indigo-600 font-bold italic py-2">
                            <Icon name="audio-lines" className="w-5 h-5 animate-pulse text-indigo-500" />
                            <span>[ AUDIO INCOMING — Click the speaker icon to stream carefully ]</span>
                        </div>
                    );
                }

                return text.split(" ").map((word, idx) => {
                    const clean = word.toLowerCase().replace(/[.,!?;:()]/g, "");
                    const isKey = currentScenario?.vocabulary?.[clean];
                    return <span key={idx} onClick={() => handleWordClick(clean)} className={`${isKey ? 'text-indigo-600 font-bold cursor-help underline decoration-dotted' : ''}`}>{word}{" "}</span>;
                });
            };

            const getGrade = () => {
                const percentage = (score / maxPossibleScore) * 100;
                if (percentage >= 90) return { label: 'Elite Specialist', color: 'text-green-600', icon: 'award' };
                if (percentage >= 75) return { label: 'Professional Portfolio', color: 'text-blue-600', icon: 'target' };
                return { label: 'Needs Retraining', color: 'text-red-600', icon: 'shield-alert' };
            };

            const activeScenarios = typeof SCENARIOS !== 'undefined' ? SCENARIOS : [];

            return (
                <div className="min-h-screen bg-slate-50 font-sans text-slate-900 flex flex-col relative overflow-hidden">
                    {activeWord && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 animate-in fade-in duration-200">
                            <div className="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl space-y-4 relative">
                                <button onClick={() => setActiveWord(null)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><Icon name="x" className="w-6 h-6" /></button>
                                <div className="flex items-center gap-2 text-indigo-600"><Icon name="book-open" className="w-5 h-5" /><h3 className="text-2xl font-black uppercase tracking-tighter">{activeWord.word}</h3></div>
                                <div className="space-y-2"><p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Meaning</p><p className="text-slate-700 text-sm leading-relaxed">{activeWord.meaning}</p></div>
                                <div className="space-y-2"><p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Examples</p>
                                    {activeWord.examples.map((ex, i) => (<p key={i} className="text-xs italic bg-slate-50 p-2 rounded-lg border-l-2 border-indigo-300">"{ex}"</p>))}
                                </div>
                            </div>
                        </div>
                    )}

                    <header className="bg-slate-900 text-white p-4 shadow-xl flex items-center justify-between border-b-4 border-indigo-500 z-20">
                        <div className="flex items-center gap-3"><div className="bg-indigo-500 p-2 rounded-lg"><Icon name="brain-circuit" className="w-6 h-6 text-white" /></div>
                            <div><h1 className="text-xl font-black tracking-tighter uppercase leading-none italic">Comprehension Master</h1><p className="text-[10px] text-indigo-300 font-bold tracking-widest uppercase">Logic & Vocab Exam</p></div>
                        </div>
                        {gameState !== 'menu' && <button onClick={() => { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); clearInterval(timerRef.current); setGameState('menu'); }} className="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-full text-xs font-bold border border-slate-700">MAIN MENU</button>}
                    </header>

                    <main className="flex-1 flex flex-col max-w-5xl mx-auto w-full p-4 md:p-6 overflow-hidden">
                        {gameState === 'menu' && (
                            <div className="flex-1 flex flex-col space-y-6 animate-in fade-in duration-500 overflow-y-auto">
                                <div className="bg-white p-8 rounded-3xl shadow-sm border border-slate-200 flex flex-col md:flex-row md:items-center justify-between gap-6">
                                    <div className="space-y-1"><h2 className="text-3xl font-black text-slate-800 uppercase italic">Training Modules</h2><p className="text-slate-500 font-medium">Curriculum CEFR progresivo. Todos los escenarios estructurados a 6+ pasos continuos.</p></div>
                                    <div className="flex gap-3">
                                        <select className="bg-slate-100 rounded-xl px-4 py-2 text-sm font-bold border" onChange={(e) => setFilter(e.target.value)}>
                                            <option value="All">All Tiers (A1 to C1)</option>
                                            <option value="A1/A2 Foundation">A1 / A2 Foundation</option>
                                            <option value="B1/B2 Technical">B1 / B2 Technical</option>
                                            <option value="C1 Advanced">C1 Advanced Retention</option>
                                        </select>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pb-10">
                                    {activeScenarios.filter(s => filter === 'All' || s.difficulty === filter).map(scenario => (
                                        <div key={scenario.id} className="bg-white border-2 border-slate-200 rounded-[2rem] p-6 shadow-sm hover:shadow-xl transition-all flex flex-col h-full">
                                            <div className="flex justify-between items-start mb-4">
                                                <span className={`px-3 py-1 rounded-full text-[10px] font-black uppercase ${scenario.difficulty.startsWith('A') ? 'bg-green-100 text-green-700' : scenario.difficulty.startsWith('B') ? 'bg-blue-100 text-blue-700' : 'bg-red-100 text-red-700'}`}>{scenario.difficulty}</span>
                                                <span className="text-[10px] font-black text-slate-400 uppercase tracking-wider">{scenario.category}</span>
                                            </div>
                                            <h3 className="text-xl font-black mb-1 uppercase italic leading-tight tracking-tight">{scenario.title}</h3>
                                            <p className="text-slate-500 text-xs mb-6 flex-1 font-medium">{scenario.description}</p>
                                            
                                            <div className="space-y-2 border-t pt-4">
                                                <p className="text-[9px] font-black uppercase text-slate-400 mb-2">Select Target Deployment Mode:</p>
                                                <div className="grid grid-cols-3 gap-1.5">
                                                    <button onClick={() => startScenario(scenario, 'normal')} className="bg-indigo-50 hover:bg-indigo-600 text-indigo-700 hover:text-white font-black p-2.5 text-[10px] rounded-xl transition-all border border-indigo-100 uppercase tracking-tighter"><Icon name="play" className="w-3 h-3 block mx-auto mb-1" /> Normal</button>
                                                    <button onClick={() => startScenario(scenario, 'timeAttack')} className="bg-amber-50 hover:bg-amber-600 text-amber-700 hover:text-white font-black p-2.5 text-[10px] rounded-xl transition-all border border-amber-100 uppercase tracking-tighter"><Icon name="timer" className="w-3 h-3 block mx-auto mb-1" /> Time Attack</button>
                                                    <button onClick={() => startScenario(scenario, 'ghostCall')} className="bg-purple-50 hover:bg-purple-600 text-purple-700 hover:text-white font-black p-2.5 text-[10px] rounded-xl transition-all border border-purple-100 uppercase tracking-tighter"><Icon name="audio-lines" className="w-3 h-3 block mx-auto mb-1" /> Ghost Call</button>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {gameState === 'playing' && (
                            <div className="flex-1 flex flex-col bg-white rounded-[2.5rem] shadow-2xl border border-slate-200 overflow-hidden min-h-0">
                                <div className="bg-slate-900 text-white px-6 py-4 flex flex-col gap-2 flex-shrink-0">
                                    <div className="flex justify-between items-center">
                                        <div className="flex items-center gap-2">
                                            <Icon name={gameMode === 'timeAttack' ? 'timer' : gameMode === 'ghostCall' ? 'audio-lines' : 'play'} className="w-4 h-4 text-indigo-400 animate-pulse" />
                                            <p className="text-[10px] font-black uppercase tracking-widest text-indigo-100">
                                                {gameMode === 'normal' && "NORMAL METRIC ASSESSMENT"}
                                                {gameMode === 'timeAttack' && "SILENT TIME ATTACK — 15S SLA LIMIT"}
                                                {gameMode === 'ghostCall' && "GHOST CALL — PURE LOGISTICS AUDIO STREAM"}
                                            </p>
                                        </div>
                                        <div className="flex items-center gap-6">
                                            {gameMode === 'timeAttack' && (
                                                <div className="text-center bg-slate-800 px-3 py-1 rounded-xl border border-slate-700">
                                                    <span className="font-mono text-base font-black text-white">{timeLeft}s</span>
                                                </div>
                                            )}
                                            <div className="text-right">
                                                <p className="text-[9px] font-bold text-slate-400 uppercase tracking-tighter">Running Score</p>
                                                <p className="font-mono text-xl font-black text-indigo-400 leading-none">{score}</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="flex-1 overflow-y-auto p-8 space-y-6 bg-slate-50/50 relative min-h-0">
                                    {chatHistory.map((msg, i) => (
                                        <div key={i} className={`flex ${msg.type === 'customer' ? 'justify-start' : msg.type === 'agent' ? 'justify-end' : 'justify-center'} animate-in slide-in-from-bottom-4 duration-300`}>
                                            {msg.type === 'system' ? (
                                                <div className="bg-red-50 border border-red-200 rounded-xl px-4 py-2 text-xs font-bold text-red-600">{msg.text}</div>
                                            ) : (
                                                <div className={`flex gap-4 max-w-[90%] ${msg.type === 'agent' ? 'flex-row-reverse' : ''} items-start`}>
                                                    <div className={`w-10 h-10 rounded-2xl flex items-center justify-center flex-shrink-0 shadow-lg ${msg.type === 'customer' ? 'bg-white border text-slate-400' : 'bg-indigo-600 text-white'}`}>
                                                        <Icon name={msg.type === 'customer' ? "user" : "headphones"} className="w-6 h-6" />
                                                    </div>
                                                    <div className="relative">
                                                        <div className={`p-5 rounded-3xl text-sm leading-relaxed shadow-sm font-medium ${msg.type === 'customer' ? 'bg-white text-slate-800 rounded-tl-none border pr-12' : 'bg-indigo-600 text-white rounded-tr-none pr-12'}`}>
                                                            {msg.type === 'customer' ? renderInteractiveText(msg.text) : msg.text}
                                                        </div>
                                                        <button 
                                                            onClick={() => speakText(msg.text)} 
                                                            className={`absolute right-3 top-4 p-1.5 rounded-xl transition-all border shadow-sm ${msg.type === 'customer' ? 'text-slate-400 hover:text-indigo-600 bg-slate-50 hover:bg-indigo-50 border-slate-100' : 'text-indigo-200 hover:text-white bg-indigo-700 hover:bg-indigo-800 border-indigo-500'}`}
                                                            title="Listen audio"
                                                        >
                                                            <Icon name="volume-2" className="w-4 h-4" />
                                                        </button>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    ))}

                                    {feedback && <div className="flex justify-center my-4 animate-in zoom-in duration-300"><div className="bg-white border-2 border-indigo-100 rounded-2xl p-4 text-center max-w-md shadow-lg">
                                        <p className="text-[10px] font-black uppercase text-indigo-600 mb-1">{feedback.points === 10 ? 'ANALISIS MAESTRO' : 'SOLUCIÓN SECA'}</p>
                                        <p className="text-xs italic font-bold text-slate-700">"{feedback.message}"</p></div></div>}
                                    <div ref={chatEndRef} />
                                </div>

                                <div className="p-8 bg-white border-t-2 flex-shrink-0">
                                    {!feedback ? (
                                        <div className="flex flex-col gap-3">
                                            <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 flex items-center gap-2"><Icon name="target" className="w-3 h-3 text-indigo-500" /> CHOOSE RESPONSE STRATEGY:</p>
                                            {shuffledOptions.map((opt, idx) => (<button key={idx} onClick={() => handleOptionClick(opt)} className="text-left p-4 text-sm font-bold bg-slate-50 hover:bg-indigo-600 hover:text-white border-2 border-slate-100 rounded-2xl transition-all shadow-sm">
                                                {opt.text}</button>))}
                                        </div>
                                    ) : (
                                        <div className="flex flex-col items-center justify-center py-6 text-slate-400 text-[10px] font-black uppercase tracking-widest gap-2">
                                            <div className="w-5 h-5 border-2 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
                                            <span>Processing learning metrics...</span>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {gameState === 'results' && (
                            <div className="flex-1 flex flex-col items-center justify-center animate-in zoom-in duration-500 overflow-y-auto py-10">
                                <div className="bg-white p-12 rounded-[3.5rem] shadow-2xl border border-slate-100 max-w-2xl w-full text-center space-y-8 relative overflow-hidden">
                                    <div className="absolute top-0 left-0 w-full h-3 bg-indigo-600"></div>
                                    <div className="space-y-4">
                                        <div className={`mx-auto w-24 h-24 rounded-3xl flex items-center justify-center bg-slate-50 border-2 ${getGrade().color} shadow-xl`}>
                                            <Icon name={getGrade().icon} className="w-16 h-16" />
                                        </div>
                                        <h2 className="text-5xl font-black text-slate-800 tracking-tighter uppercase italic">{getGrade().label}</h2>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="bg-slate-50 p-6 rounded-3xl border border-slate-200 flex flex-col justify-center"><p className="text-[10px] font-black text-slate-400 uppercase mb-1 tracking-widest">Final Mode Score</p><p className="text-4xl font-black text-indigo-600">{score}</p></div>
                                        <div className="bg-slate-50 p-6 rounded-3xl border border-slate-200 flex flex-col justify-center"><p className="text-[10px] font-black text-slate-400 uppercase mb-1 tracking-widest">Accuracy Rate</p><p className="text-4xl font-black text-indigo-600">{Math.round((score/maxPossibleScore) * 100)}%</p></div>
                                    </div>
                                    <div className="bg-indigo-900 p-8 rounded-[2.5rem] shadow-xl text-white text-left space-y-6">
                                        <div className="flex items-center justify-between border-b border-indigo-700 pb-4">
                                            <div className="flex items-center gap-2"><Icon name="book-open" className="w-6 h-6 text-indigo-300" /><h3 className="text-lg font-black uppercase tracking-widest italic">Vocab Summary for Notebook</h3></div>
                                            <button onClick={() => { 
                                                const text = vocabularyLog.map(v => `${v.word.toUpperCase()}\nMeaning: ${v.meaning}\nEx: ${v.examples[0]}\nEx: ${v.examples[1]}`).join('\n---\n'); 
                                                const el = document.createElement('textarea');
                                                el.value = text;
                                                document.body.appendChild(el);
                                                el.select();
                                                document.execCommand('copy');
                                                document.body.removeChild(el);
                                            }} className="bg-indigo-700 hover:bg-indigo-600 px-4 py-2 rounded-xl text-[10px] font-black transition-all flex items-center gap-2"><Icon name="copy" className="w-3 h-3" /> COPY LIST</button>
                                        </div>
                                        {vocabularyLog.length > 0 ? (
                                            <div className="space-y-6 max-h-[300px] overflow-y-auto pr-4 scrollbar-thin">
                                                {vocabularyLog.map((item, idx) => (
                                                    <div key={idx} className="space-y-1"><p className="text-indigo-400 font-black uppercase text-xl">{item.word}</p><p className="text-xs font-medium text-slate-300">{item.meaning}</p>
                                                        <p className="text-[10px] italic text-indigo-200 opacity-80 border-l-2 border-indigo-600 pl-3">"{item.examples[0]}"</p>
                                                        <p className="text-[10px] italic text-indigo-200 opacity-80 border-l-2 border-indigo-600 pl-3">"{item.examples[1]}"</p></div>))}
                                            </div>
                                        ) : (<p className="text-center text-indigo-300 font-bold italic py-10 uppercase text-xs">No words consulted. Good job!</p>)}
                                    </div>
                                    <button onClick={() => setGameState('menu')} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-5 rounded-2xl transition-all uppercase text-xs">Main Menu</button>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
