<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprehension Master - Simulador de Call Center E4CC</title>
    
    <!-- Carga de la base de datos externa local -->
    <script src="scenarios.js"></script>
    
    <!-- Librerías Externas de UI -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Configuración personalizada de la paleta corporativa E4CC -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            blue: '#122c47',        /* Azul Oscuro Principal */
                            orange: '#e9521d',      /* Naranja Intenso */
                            orangeMed: '#d3781c',   /* Naranja Medio */
                            orangeDark: '#c74b1b',  /* Naranja Claro/Óxido */
                            orangeLight: '#fff2ed', /* Variante de fondo naranja muy suave */
                            blueLight: '#f0f5fa'    /* Variante de fondo azul muy suave */
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .cursor-help { cursor: help; }
        /* Estilos personalizados para la barra de desplazamiento */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(241, 241, 241, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: #d3781c;
            border-radius: 999px;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Fallback de Escenarios interactivos con feedbacks localizados al español
        const FALLBACK_SCENARIOS = [
            {
                id: 1,
                title: "Billing Discrepancy Premium",
                category: "Financial Support",
                difficulty: "B1/B2 Technical",
                description: "De-escalate an upset customer who noticed a discrepancy with double subscription charges, and secure premium retention.",
                vocabulary: {
                    discrepancy: {
                        meaning: "An unexpected difference or lack of compatibility between two or more facts.",
                        examples: ["I found a critical discrepancy in my monthly premium bill.", "We resolved the financial discrepancy within minutes."]
                    },
                    premium: {
                        meaning: "A high-quality level of service, or the amount paid for a subscription plan.",
                        examples: ["Our premium membership offers unlimited professional coaching.", "The premium charge is automatically billed monthly."]
                    },
                    overcharge: {
                        meaning: "An instance of charging someone too much money for a service or product.",
                        examples: ["This overcharge must be refunded to my credit card immediately.", "We apologize sincerely for the accidental overcharge."]
                    }
                },
                steps: [
                    {
                        customer: "Hello! I am furious. Your system charged me twice for my premium tier subscription! This is a major discrepancy and I want this overcharge refunded right away!",
                        options: [
                            {
                                text: "I completely understand your frustration with this billing discrepancy. Let me review your premium charges immediately to issue a refund for this overcharge.",
                                points: 10,
                                feedback: "¡Perfecto! Empatía de alto nivel, uso de vocabulario activo y tono orientado a la acción inmediata."
                            },
                            {
                                text: "Calm down, please. It is probably just a small error. Can you give me your account number to see if there is an overcharge?",
                                points: 4,
                                feedback: "Ten cuidado. Decirle a un cliente enojado que se 'calme' generalmente aumenta su irritación y frustración."
                            },
                            {
                                text: "I am initiating the termination protocol to cross-reference our billing infrastructure availability for your account.",
                                points: 2,
                                feedback: "Demasiado complejo y mecánico. Palabras como 'termination protocol', 'cross-reference' e 'infrastructure availability' sobrecargan la conversación."
                            },
                            {
                                text: "Our billing system is secure. Are you sure you didn't buy two subscriptions by mistake?",
                                points: 1,
                                feedback: "Evita transferir la culpa al cliente. Esto destruye la confianza y puede provocar una cancelación inmediata del servicio."
                            }
                        ]
                    },
                    {
                        customer: "Thank you for acknowledging the problem. Yes, I saw two separate forty-dollar charges on Tuesday. This is a clear overcharge and it has ruined my budget.",
                        options: [
                            {
                                text: "I see the double transactions here. I have processed the refund for the overcharge, and it will clear in your account within 24 hours.",
                                points: 10,
                                feedback: "¡Excelente! Confirmaste la transacción de inmediato y proporcionaste un tiempo de resolución claro y rápido."
                            },
                            {
                                text: "I can see the Tuesday charges. I will send a note to our billing department to see if they can reverse it next week.",
                                points: 5,
                                feedback: "Un poco pasivo. Los clientes prefieren acciones inmediatas y pasos de resolución con plazos establecidos claros."
                            }
                        ]
                    },
                    {
                        customer: "I appreciate the quick refund, but honestly, this reliability issue makes me want to cancel my premium service altogether.",
                        options: [
                            {
                                text: "We truly value your loyalty. To show our dedication, I will apply a full credit for your next month of premium service entirely free.",
                                points: 10,
                                feedback: "¡Brillante salvada! Ofrecer un crédito de retención mantiene al cliente interesado y restaura la confianza en la marca."
                            },
                            {
                                text: "Okay, if you really want to cancel, I can help you process that right now. Do you want me to proceed?",
                                points: 5,
                                feedback: "Demasiado rápido para dejarlo ir. Siempre debes intentar ofrecer una alternativa o crédito de valor para retener al usuario primero."
                            }
                        ]
                    }
                ]
            },
            {
                id: 2,
                title: "Irritated Flight Delay Assistance",
                category: "Customer Service",
                difficulty: "A1/A2 Foundation",
                description: "Help a traveler find their gate and reschedule their delayed departure with clear, polite English instructions.",
                vocabulary: {
                    delayed: {
                        meaning: "Happening or arriving later than planned, expected, or scheduled.",
                        examples: ["The 3:00 PM flight to Chicago is delayed.", "Bad weather delayed our departure from the terminal."]
                    },
                    gate: {
                        meaning: "The specific area at an airport where passengers board or exit their airplane.",
                        examples: ["Please check your boarding pass for the correct gate number.", "We must run to gate twelve before the doors close."]
                    }
                },
                steps: [
                    {
                        customer: "Excuse me! My flight is heavily delayed and now I am going to miss my connection. Where is the customer service gate?",
                        options: [
                            {
                                text: "Hello! I am very sorry to hear your flight is delayed. The customer service gate is located right next to gate B15. Let me help you find it.",
                                points: 10,
                                feedback: "¡Excelente! Altamente empático, indicaciones claras y tranquiliza al cliente de forma oportuna."
                            },
                            {
                                text: "Delays happen all the time. Just look at the screen monitors to find the nearest gate.",
                                points: 2,
                                feedback: "Un poco indiferente. Los viajeros ansiosos necesitan orientación amigable, no ser ignorados ni despachados."
                            }
                        ]
                    },
                    {
                        customer: "Okay, I am at gate B15 now. Can you book me on the next available flight to Chicago?",
                        options: [
                            {
                                text: "Yes, I found a seat on the flight leaving in one hour from gate C2. I have successfully booked it for you.",
                                points: 10,
                                feedback: "¡Fantástico! Solución rápida, información directa y excelente servicio de atención."
                            },
                            {
                                text: "No, everything is fully booked. You'll just have to wait around until tomorrow.",
                                points: 1,
                                feedback: "Mal esfuerzo de soporte. Siempre debes explorar opciones de lista de espera o conexiones alternativas en primer lugar."
                            }
                        ]
                    }
                ]
            }
        ];

        // MOTOR DE TRADUCCIÓN INTERCEPTO EN TIEMPO DE EJECUCIÓN (Runtime English to Spanish QA translator)
        const translateFeedbackText = (text) => {
            if (!text) return "";
            
            const dictionary = {
                // Mapeos exactos de QA de scenarios.js
                "Perfect! Empathy, active vocabulary usage, and immediate action-oriented tone.": "¡Perfecto! Empatía, uso de vocabulario activo y tono orientado a la acción inmediata.",
                "Be careful. Telling an angry customer to 'calm down' usually escalates their irritation.": "Ten cuidado. Decirle a un cliente enojado que se 'calme' generalmente aumenta su irritación.",
                "Avoid shifting blame to the customer. This can trigger immediate cancellation.": "Evita transferir la culpa al cliente. Esto puede provocar una cancelación inmediata del servicio.",
                "Excellent! You confirmed the transaction and provided a clear, fast resolution timeline.": "¡Excelente! Confirmaste la transacción y proporcionaste un tiempo de resolución claro y rápido.",
                "A bit too passive. Customers prefer immediate action and clear resolution steps.": "Un poco pasivo. Los clientes prefieren acciones inmediatas y pasos de resolución claros.",
                "Brilliant save! Offering a retention credit keeps the customer engaged and restores brand trust.": "¡Brillante salvada! Ofrecer un crédito de retención mantiene al cliente interesado y restaura la confianza en la marca.",
                "Too quick to let them go. You should always try to offer an alternative or credit to retain the user first.": "Demasiado rápido para dejarlo ir. Siempre debes intentar ofrecer una alternativa o crédito para retener al usuario primero.",
                "Great! Highly empathetic, clear directions, and reassures the customer.": "¡Excelente! Altamente empático, indicaciones claras y tranquiliza al cliente.",
                "Slightly rude. Anxious travelers need friendly guidance, not dismissed.": "Un poco indiferente. Los viajeros ansiosos necesitan orientación amigable, no ser ignorados.",
                "Fantastic! Prompt solution, direct information, and excellent customer service.": "¡Fantástico! Solución rápida, información directa y excelente servicio al cliente.",
                "Poor effort. You should always explore standby or alternative connections first.": "Mal esfuerzo. Siempre debes explorar opciones de espera o conexiones alternativas primero.",
                "AHT Exceeded": "Tiempo de AHT Excedido"
            };

            if (dictionary[text]) return dictionary[text];

            // Heurística de detección secundaria por patrones de palabras clave si viene de scenarios.js externo
            const textLower = text.toLowerCase();
            if (textLower.includes("robotic") || textLower.includes("termination protocol") || textLower.includes("infrastructure availability")) {
                return "Demasiado complejo y mecánico. Palabras como 'termination protocol', 'cross-reference' e 'infrastructure availability' sobrecargan la conversación.";
            }
            if (textLower.includes("empathy") || textLower.includes("understand your frustration")) {
                return "¡Perfecto! Demuestras empatía activa, usas vocabulario del caso y aplicas un tono de resolución inmediato.";
            }
            if (textLower.includes("calm down") || textLower.includes("anger")) {
                return "Ten cuidado. Decirle a un cliente que se 'calme' suele percibirse como condescendiente y aumenta la irritación.";
            }
            if (textLower.includes("blame") || textLower.includes("customer's fault") || textLower.includes("did you buy")) {
                return "Evita transferir la culpa al cliente o dudar de su versión de los hechos. Esto rompe la retención de marca.";
            }
            if (textLower.includes("confirm") || textLower.includes("refund processed") || textLower.includes("clear in your account")) {
                return "¡Excelente! Confirmaste los datos financieros con precisión y diste tiempos estimados de procesamiento claros.";
            }
            if (textLower.includes("cancel") || textLower.includes("let them cancel") || textLower.includes("proceed with cancellation")) {
                return "Demasiado rápido para procesar una baja. En operaciones, la prioridad es mitigar la deserción aplicando políticas de retención activas.";
            }
            if (textLower.includes("passive") || textLower.includes("too slow") || textLower.includes("next week")) {
                return "Un poco pasivo. Los usuarios en canales de soporte buscan confirmaciones directas y asertividad de plazos.";
            }
            if (textLower.includes("flight is delayed") || textLower.includes("gate")) {
                return "¡Excelente! Diste instrucciones de navegación claras en el aeropuerto y transmitiste control operativo.";
            }

            return text; 
        };

        const Icon = ({ name, className }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} className={className}></i>;
        };

        const App = () => {
            const [gameState, setGameState] = useState('menu'); 
            const [gameMode, setGameMode] = useState('normal'); 
            const [currentScenario, setCurrentScenario] = useState(null);
            const [currentStep, setCurrentStep] = useState(0);
            const [chatHistory, setChatHistory] = useState([]);
            const [score, setScore] = useState(0);
            const [maxPossibleScore, setMaxPossibleScore] = useState(0);
            const [feedback, setFeedback] = useState(null);
            const [shuffledOptions, setShuffledOptions] = useState([]);
            const [filter, setFilter] = useState('All');
            const [vocabularyLog, setVocabularyLog] = useState([]);
            const [activeWord, setActiveWord] = useState(null);
            
            // Estado de carga para la búsqueda de vocabulario en API
            const [isSearchingVocab, setIsSearchingVocab] = useState(false);
            
            const [timeLeft, setTimeLeft] = useState(15);
            const timerRef = useRef(null);
            const chatEndRef = useRef(null);

            const speakText = (text) => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'en-US';
                    const voices = window.speechSynthesis.getVoices();
                    const enVoice = voices.find(v => v.lang.startsWith('en-US') || v.lang.startsWith('en-GB'));
                    if (enVoice) utterance.voice = enVoice;
                    utterance.rate = 0.95; 
                    window.speechSynthesis.speak(utterance);
                }
            };

            useEffect(() => {
                if (gameState === 'playing' && gameMode === 'timeAttack' && !feedback) {
                    setTimeLeft(15);
                    timerRef.current = setInterval(() => {
                        setTimeLeft((prev) => {
                            if (prev <= 1) {
                                clearInterval(timerRef.current);
                                handleTimeOut();
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(timerRef.current);
            }, [currentStep, gameState, feedback, gameMode]);

            useEffect(() => { 
                if (gameState === 'playing') chatEndRef.current?.scrollIntoView({ behavior: "smooth" }); 
            }, [chatHistory, feedback]);

            const handleTimeOut = () => {
                setScore((prev) => Math.max(0, prev - 5));
                
                // Mensajes de SLA completamente localizados en español
                const timeOutText = "LÍMITE DE AHT INCUMPLIDO: Se ha superado el umbral de SLA de respuesta. La satisfacción del cliente está disminuyendo.";
                const timeOutFeedback = "¡Tiempo de AHT Excedido! Tardaste más de 15 segundos en evaluar la estrategia de respuesta. (-5 Puntos de Lógica)";
                
                setChatHistory(prev => [...prev, { 
                    type: 'system', 
                    text: timeOutText, 
                    points: 0, 
                    feedback: "AHT Excedido" 
                }]);
                
                setFeedback({ points: 0, message: timeOutFeedback });

                setTimeout(() => {
                    setFeedback(null);
                    advanceStep();
                }, 4500);
            };

            const startScenario = (scenario, mode) => {
                if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                
                setGameMode(mode);
                setCurrentScenario(scenario);
                setCurrentStep(0);
                setScore(0);
                setMaxPossibleScore(scenario.steps.length * 10);
                setFeedback(null);
                setVocabularyLog([]);
                setGameState('playing');

                const firstText = scenario.steps[0].customer;
                setChatHistory([{ type: 'customer', text: firstText, points: null, feedback: null }]);
                setShuffledOptions([...scenario.steps[0].options].sort(() => Math.random() - 0.5));

                if (mode !== 'timeAttack') {
                    setTimeout(() => speakText(firstText), 300);
                }
            };

            const handleOptionClick = (option) => {
                if (feedback) return;
                if (timerRef.current) clearInterval(timerRef.current);
                if ('speechSynthesis' in window) window.speechSynthesis.cancel();

                // Mecanismo de traducción / fallback para scenarios.js externos en tiempo de ejecución
                const localSpanishFeedback = translateFeedbackText(option.feedback);

                setChatHistory([...chatHistory, { 
                    type: 'agent', 
                    text: option.text,
                    points: option.points,
                    feedback: localSpanishFeedback
                }]);
                
                setScore(score + option.points);
                setFeedback({ points: option.points, message: localSpanishFeedback });
                
                setTimeout(() => {
                    setFeedback(null);
                    advanceStep();
                }, 4500); 
            };

            const advanceStep = () => {
                const nextStep = currentStep + 1;
                if (nextStep < currentScenario.steps.length) {
                    setCurrentStep(nextStep);
                    const nextText = currentScenario.steps[nextStep].customer;
                    setChatHistory(prev => [...prev, { type: 'customer', text: nextText, points: null, feedback: null }]);
                    setShuffledOptions([...currentScenario.steps[nextStep].options].sort(() => Math.random() - 0.5));
                    
                    if (gameMode !== 'timeAttack') speakText(nextText);
                } else { 
                    setGameState('results'); 
                }
            };

            const handleWordClick = async (wordKey) => {
                const cleanWord = wordKey.toLowerCase().replace(/[.,!?;:()"'“”‘’\[\]\{\}]/g, "").trim();
                if (!cleanWord) return;

                setActiveWord({ word: cleanWord, loading: true });
                setIsSearchingVocab(true);

                const localVocab = currentScenario?.vocabulary?.[cleanWord];
                if (localVocab) {
                    const wordObj = {
                        word: cleanWord,
                        meaning: localVocab.meaning,
                        examples: localVocab.examples || [],
                        isLive: false
                    };
                    setActiveWord(wordObj);
                    setIsSearchingVocab(false);
                    
                    setVocabularyLog(prev => {
                        if (prev.some(item => item.word === cleanWord)) return prev;
                        return [...prev, wordObj];
                    });
                    return;
                }

                try {
                    const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${cleanWord}`);
                    if (!response.ok) throw new Error("Palabra no encontrada");
                    
                    const data = await response.json();
                    const firstEntry = data[0];
                    const meaning = firstEntry?.meanings?.[0]?.definitions?.[0]?.definition || "Definición alternativa no disponible en el sistema.";
                    
                    const examples = [];
                    firstEntry?.meanings?.forEach(m => {
                        m.definitions?.forEach(d => {
                            if (d.example && examples.length < 2) {
                                examples.push(d.example);
                            }
                        });
                    });

                    const wordObj = {
                        word: cleanWord,
                        meaning: meaning,
                        examples: examples,
                        isLive: true
                    };
                    
                    setActiveWord(wordObj);
                    setVocabularyLog(prev => {
                        if (prev.some(item => item.word === cleanWord)) return prev;
                        return [...prev, wordObj];
                    });
                } catch (error) {
                    setActiveWord({
                        word: cleanWord,
                        meaning: "No pudimos encontrar la definición de esta palabra. Por favor, verifica la ortografía o intenta buscar un término diferente.",
                        examples: [],
                        isError: true,
                        isLive: true
                    });
                } finally {
                    setIsSearchingVocab(false);
                }
            };

            const renderInteractiveText = (text) => {
                if (gameMode === 'ghostCall') {
                    return (
                        <div className="flex items-center gap-2 text-brand-orange font-bold italic py-2">
                            <Icon name="audio-lines" className="w-5 h-5 animate-pulse text-brand-orange" />
                            <span>[ AUDIO INCOMING — Click the speaker icon to stream carefully ]</span>
                        </div>
                    );
                }

                return text.split(" ").map((word, idx) => {
                    const clean = word.toLowerCase().replace(/[.,!?;:()"'“”‘’\[\]\{\}]/g, "");
                    const isKey = currentScenario?.vocabulary?.[clean];
                    
                    if (!clean) return <span key={idx}>{word} </span>;
                    
                    return (
                        <span 
                            key={idx} 
                            onClick={() => handleWordClick(clean)} 
                            className={isKey 
                                ? 'text-brand-orange font-black cursor-help underline decoration-2 decoration-brand-orange hover:text-brand-orangeMed transition-all duration-200'
                                : 'text-slate-700 hover:text-brand-orange font-medium cursor-help underline decoration-dotted decoration-slate-300 hover:decoration-brand-orange transition-all'
                            }
                        >
                            {word}{" "}
                        </span>
                    );
                });
            };

            const getGrade = () => {
                if (maxPossibleScore === 0) return { label: 'URGENT', color: 'text-rose-600 border-rose-200 bg-rose-50', icon: 'shield-alert' };
                const percentage = (score / maxPossibleScore) * 100;
                
                if (percentage >= 98) {
                    return { 
                        label: 'EXCELLENT PLUS', 
                        color: 'text-amber-500 border-amber-300 bg-amber-50/80 animate-pulse font-black scale-105', 
                        icon: 'star' 
                    };
                }
                if (percentage >= 90) {
                    return { 
                        label: 'EXCELLENT', 
                        color: 'text-emerald-600 border-emerald-200 bg-emerald-50', 
                        icon: 'award' 
                    };
                }
                if (percentage >= 75) {
                    return { 
                        label: 'GREAT JOB', 
                        color: 'text-brand-blue border-brand-blue/20 bg-brand-blueLight', 
                        icon: 'thumbs-up' 
                    };
                }
                if (percentage >= 60) {
                    return { 
                        label: 'ALMOST THERE', 
                        color: 'text-brand-orangeMed border-brand-orangeMed/20 bg-orange-50', 
                        icon: 'trending-up' 
                    };
                }
                if (percentage >= 40) {
                    return { 
                        label: 'NEEDS TO IMPROVE', 
                        color: 'text-brand-orangeDark border-brand-orangeDark/20 bg-amber-50', 
                        icon: 'alert-triangle' 
                    };
                }
                return { 
                    label: 'URGENT', 
                    color: 'text-rose-600 border-rose-200 bg-rose-50', 
                    icon: 'shield-alert' 
                };
            };

            const activeScenarios = typeof SCENARIOS !== 'undefined' && SCENARIOS.length > 0 ? SCENARIOS : FALLBACK_SCENARIOS;

            return (
                <div className="min-h-screen bg-slate-50 font-sans text-slate-800 flex flex-col relative overflow-hidden">
                    
                    {/* Modal interactivo de vocabulario */}
                    {activeWord && (
                        <div className="fixed inset-0 bg-brand-blue/80 z-50 flex items-center justify-center p-4 animate-in fade-in duration-200">
                            <div className="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl space-y-5 relative border border-slate-100">
                                <button 
                                    onClick={() => { setActiveWord(null); setIsSearchingVocab(false); }} 
                                    className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 transition-all"
                                >
                                    <Icon name="x" className="w-6 h-6" />
                                </button>

                                {isSearchingVocab || activeWord.loading ? (
                                    <div className="flex flex-col items-center justify-center py-12 space-y-4">
                                        <Icon name="loader-2" className="w-10 h-10 text-brand-orange animate-spin" />
                                        <p className="text-xs font-black uppercase tracking-widest text-slate-400 animate-pulse">Buscando en diccionario...</p>
                                    </div>
                                ) : (
                                    <>
                                        <div className="flex items-center justify-between gap-2 border-b border-slate-100 pb-3">
                                            <div className="flex items-center gap-2 text-brand-orange min-w-0">
                                                <Icon name="book-open" className="w-6 h-6 flex-shrink-0" />
                                                <h3 className="text-2xl font-black uppercase tracking-tighter truncate">{activeWord.word}</h3>
                                            </div>
                                            {activeWord.isLive && !activeWord.isError && (
                                                <span className="bg-slate-100 text-slate-500 text-[9px] font-black uppercase tracking-wider px-2 py-1 rounded-md flex-shrink-0">
                                                    Live Dictionary
                                                </span>
                                            )}
                                        </div>
                                        <div className="space-y-2">
                                            <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Meaning</p>
                                            <p className="text-slate-700 text-sm leading-relaxed">{activeWord.meaning}</p>
                                        </div>
                                        {activeWord.examples && activeWord.examples.length > 0 && (
                                            <div className="space-y-2">
                                                <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Examples</p>
                                                {activeWord.examples.map((ex, i) => (
                                                    <p key={i} className="text-xs italic bg-brand-orangeLight p-3 rounded-xl border-l-4 border-brand-orange text-slate-700">
                                                        "{ex}"
                                                    </p>
                                                ))}
                                            </div>
                                        )}
                                    </>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Encabezado Principal E4CC */}
                    <header className="bg-brand-blue text-white p-4 shadow-xl flex items-center justify-between border-b-4 border-brand-orange z-20 transition-all duration-300">
                        <div className="flex items-center gap-4">
                            <img 
                                src="image_196b82.png" 
                                className="h-10 w-auto object-contain bg-white rounded-full p-0.5 shadow-md" 
                                alt="E4CC Icon" 
                                onError={(e) => { e.target.style.display = 'none'; }}
                            />
                            <img 
                                src="image_196b8a.png" 
                                className="h-10 w-auto object-contain hidden md:block" 
                                alt="E4CC Logo" 
                                onError={(e) => { e.target.style.display = 'none'; }}
                            />
                            <div className="flex flex-col justify-center">
                                <h1 className="text-xl font-black tracking-tighter uppercase leading-none italic text-white flex items-center gap-2 md:hidden">
                                    E4CC <span className="text-[10px] bg-brand-orange text-white px-1.5 py-0.5 rounded not-italic">SIM</span>
                                </h1>
                                <p className="text-[10px] text-brand-orange font-bold tracking-widest uppercase">
                                    #1 en inglés para el trabajo
                                </p>
                            </div>
                        </div>

                        {gameState !== 'menu' && (
                            <button 
                                onClick={() => { 
                                    if ('speechSynthesis' in window) window.speechSynthesis.cancel(); 
                                    clearInterval(timerRef.current); 
                                    setGameState('menu'); 
                                }} 
                                className="bg-brand-orange hover:bg-brand-orangeMed text-white px-5 py-2.5 rounded-full text-xs font-black tracking-wider transition-all shadow-md uppercase"
                            >
                                MAIN MENU
                            </button>
                        )}
                    </header>

                    {/* Contenido Principal */}
                    <main className="flex-1 flex flex-col max-w-5xl mx-auto w-full p-4 md:p-6 overflow-hidden">
                        
                        {/* Menú de Módulos */}
                        {gameState === 'menu' && (
                            <div className="flex-1 flex flex-col space-y-6 animate-in fade-in duration-500 overflow-y-auto pr-1">
                                <div className="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-200 flex flex-col md:flex-row md:items-center justify-between gap-6">
                                    <div className="space-y-1">
                                        <h2 className="text-3xl font-black text-brand-blue uppercase italic tracking-tight">Training Modules</h2>
                                        <p className="text-slate-500 text-sm font-medium">Curriculum CEFR progresivo. Todos los escenarios estructurados para evaluación continua.</p>
                                    </div>
                                    <div className="flex gap-3">
                                        <select 
                                            className="bg-brand-blueLight text-brand-blue rounded-2xl px-4 py-3 text-sm font-bold border-2 border-slate-200 focus:border-brand-orange focus:outline-none transition-all cursor-pointer" 
                                            onChange={(e) => setFilter(e.target.value)}
                                        >
                                            <option value="All">All Tiers (A1 to C1)</option>
                                            <option value="A1/A2 Foundation">A1 / A2 Foundation</option>
                                            <option value="B1/B2 Technical">B1 / B2 Technical</option>
                                            <option value="C1 Advanced">C1 Advanced Retention</option>
                                        </select>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pb-10">
                                    {activeScenarios.filter(s => filter === 'All' || s.difficulty === filter).map(scenario => (
                                        <div key={scenario.id} className="bg-white border-2 border-slate-100 rounded-[2.5rem] p-6 shadow-sm hover:shadow-xl hover:border-brand-orange/35 transition-all flex flex-col h-full relative overflow-hidden group">
                                            <div className="absolute top-0 left-0 w-full h-1.5 bg-brand-blue group-hover:bg-brand-orange transition-all duration-300"></div>
                                            
                                            <div className="flex justify-between items-start mb-4">
                                                <span className={`px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-wider ${
                                                    scenario.difficulty.startsWith('A') 
                                                        ? 'bg-emerald-100 text-emerald-800' 
                                                        : scenario.difficulty.startsWith('B') 
                                                            ? 'bg-brand-blueLight text-brand-blue' 
                                                            : 'bg-brand-orangeLight text-brand-orange'
                                                }`}>
                                                    {scenario.difficulty}
                                                </span>
                                                <span className="text-[10px] font-black text-slate-400 uppercase tracking-wider">{scenario.category}</span>
                                            </div>
                                            
                                            <h3 className="text-xl font-black mb-1.5 uppercase italic text-brand-blue group-hover:text-brand-orange transition-colors duration-300 leading-tight tracking-tight">
                                                {scenario.title}
                                            </h3>
                                            <p className="text-slate-500 text-xs mb-6 flex-1 font-medium leading-relaxed">{scenario.description}</p>
                                            
                                            <div className="space-y-2 border-t border-slate-100 pt-4 mt-auto">
                                                <p className="text-[9px] font-black uppercase text-slate-400 mb-2 tracking-wider">Select Target Deployment Mode:</p>
                                                <div className="grid grid-cols-3 gap-2">
                                                    <button 
                                                        onClick={() => startScenario(scenario, 'normal')} 
                                                        className="bg-brand-blueLight hover:bg-brand-blue text-brand-blue hover:text-white font-black p-2.5 text-[10px] rounded-xl transition-all border border-brand-blue/10 uppercase tracking-tighter flex flex-col items-center justify-center gap-1 shadow-sm"
                                                    >
                                                        <Icon name="play" className="w-3 h-3" />
                                                        <span>Normal</span>
                                                    </button>
                                                    <button 
                                                        onClick={() => startScenario(scenario, 'timeAttack')} 
                                                        className="bg-brand-orangeLight hover:bg-brand-orange text-brand-orange hover:text-white font-black p-2.5 text-[10px] rounded-xl transition-all border border-brand-orange/10 uppercase tracking-tighter flex flex-col items-center justify-center gap-1 shadow-sm"
                                                    >
                                                        <Icon name="timer" className="w-3 h-3" />
                                                        <span>Time Attack</span>
                                                    </button>
                                                    <button 
                                                        onClick={() => startScenario(scenario, 'ghostCall')} 
                                                        className="bg-orange-50 hover:bg-brand-orangeMed text-brand-orangeMed hover:text-white font-black p-2.5 text-[10px] rounded-xl transition-all border border-brand-orangeMed/10 uppercase tracking-tighter flex flex-col items-center justify-center gap-1 shadow-sm"
                                                    >
                                                        <Icon name="audio-lines" className="w-3 h-3" />
                                                        <span>Ghost Call</span>
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* Consola de Juego (Chat del Call Center) */}
                        {gameState === 'playing' && (
                            <div className="flex-1 flex flex-col bg-white rounded-[2.5rem] shadow-2xl border border-slate-200 overflow-hidden min-h-0">
                                
                                {/* Info del Escenario actual */}
                                <div className="bg-brand-blue text-white px-6 py-4 flex flex-col gap-2 flex-shrink-0 border-b-2 border-brand-orange">
                                    <div className="flex justify-between items-center">
                                        <div className="flex items-center gap-2">
                                            <Icon name={gameMode === 'timeAttack' ? 'timer' : gameMode === 'ghostCall' ? 'audio-lines' : 'play'} className="w-4 h-4 text-brand-orange animate-pulse" />
                                            <p className="text-[10px] font-black uppercase tracking-widest text-brand-orangeLight">
                                                {gameMode === 'normal' && "NORMAL METRIC ASSESSMENT"}
                                                {gameMode === 'timeAttack' && "SILENT TIME ATTACK — 15S SLA LIMIT"}
                                                {gameMode === 'ghostCall' && "GHOST CALL — PURE LOGISTICS AUDIO STREAM"}
                                            </p>
                                        </div>
                                        <div className="flex items-center gap-6">
                                            {gameMode === 'timeAttack' && (
                                                <div className="text-center bg-brand-blue/80 px-3 py-1 rounded-xl border border-brand-orange/40">
                                                    <span className="font-mono text-base font-black text-brand-orange">{timeLeft}s</span>
                                                </div>
                                            )}
                                            <div className="text-right">
                                                <p className="text-[9px] font-bold text-slate-300 uppercase tracking-tighter">Running Score</p>
                                                <p className="font-mono text-xl font-black text-brand-orange leading-none">{score}</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* Ventana de Chat */}
                                <div className="flex-1 overflow-y-auto p-8 space-y-6 bg-slate-50/50 relative min-h-0">
                                    {chatHistory.map((msg, i) => (
                                        <div key={i} className={`flex ${msg.type === 'customer' ? 'justify-start' : msg.type === 'agent' ? 'justify-end' : 'justify-center'} animate-in slide-in-from-bottom-4 duration-300`}>
                                            {msg.type === 'system' ? (
                                                <div className="bg-red-50 border border-red-200 rounded-xl px-4 py-2 text-xs font-bold text-red-600 shadow-sm max-w-lg text-center break-words overflow-hidden">
                                                    {msg.text}
                                                </div>
                                            ) : (
                                                <div className={`flex gap-4 max-w-[90%] ${msg.type === 'agent' ? 'flex-row-reverse' : ''} items-start`}>
                                                    <div className={`w-10 h-10 rounded-2xl flex items-center justify-center flex-shrink-0 shadow-md ${msg.type === 'customer' ? 'bg-white border text-slate-400' : 'bg-brand-blue text-white'}`}>
                                                        <Icon name={msg.type === 'customer' ? "user" : "headphones"} className="w-5 h-5" />
                                                    </div>
                                                    
                                                    <div className="relative">
                                                        <div className={`p-5 rounded-3xl text-sm leading-relaxed shadow-sm font-medium pr-12 break-words overflow-hidden ${msg.type === 'customer' ? 'bg-white text-slate-800 rounded-tl-none border border-slate-100' : 'bg-brand-blue text-white rounded-tr-none'}`}>
                                                            {msg.type === 'customer' ? renderInteractiveText(msg.text) : msg.text}
                                                        </div>
                                                        <button 
                                                            onClick={() => speakText(msg.text)} 
                                                            className={`absolute right-3 top-4 p-1.5 rounded-xl transition-all border shadow-sm ${msg.type === 'customer' ? 'text-slate-400 hover:text-brand-orange bg-slate-50 hover:bg-brand-orangeLight border-slate-100' : 'text-slate-300 hover:text-white bg-brand-blue/80 hover:bg-brand-blue border-slate-700'}`}
                                                            title="Listen audio"
                                                        >
                                                            <Icon name="volume-2" className="w-4 h-4" />
                                                        </button>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    ))}

                                    {/* Caja de Feedback Temporal Rediseñada (Soporte elástico y paddings responsivos) */}
                                    {feedback && (
                                        <div className="flex justify-center my-4 px-4 animate-in zoom-in duration-300 w-full">
                                            <div className="bg-white border-2 border-brand-orange/30 rounded-[2rem] p-5 sm:p-6 text-center w-full max-w-xl shadow-xl hover:shadow-2xl transition-all overflow-hidden">
                                                <span className="inline-block px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-wider bg-brand-orangeLight text-brand-orange mb-2.5">
                                                    {feedback.points === 10 ? 'EXCELENTE ANÁLISIS' : 'SITUACIÓN EVALUADA'}
                                                </span>
                                                <p className="text-xs sm:text-sm italic font-bold text-slate-700 leading-relaxed break-words whitespace-normal max-w-full">
                                                    "{feedback.message}"
                                                </p>
                                            </div>
                                        </div>
                                    )}
                                    <div ref={chatEndRef} />
                                </div>

                                {/* Selección de Respuesta */}
                                <div className="p-8 bg-white border-t-2 border-slate-100 flex-shrink-0">
                                    {!feedback ? (
                                        <div className="flex flex-col gap-3">
                                            <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 flex items-center gap-2">
                                                <Icon name="target" className="w-3.5 h-3.5 text-brand-orange" /> 
                                                CHOOSE RESPONSE STRATEGY:
                                            </p>
                                            {shuffledOptions.map((opt, idx) => (
                                                <button 
                                                    key={idx} 
                                                    onClick={() => handleOptionClick(opt)} 
                                                    className="text-left p-4 text-sm font-bold bg-slate-50 hover:bg-brand-blue hover:text-white border-2 border-slate-100 hover:border-brand-blue rounded-2xl transition-all shadow-sm break-words"
                                                >
                                                    {opt.text}
                                                </button>
                                            ))}
                                        </div>
                                    ) : (
                                        <div className="flex flex-col items-center justify-center py-6 text-brand-orange text-[10px] font-black uppercase tracking-widest gap-3">
                                            <div className="w-6 h-6 border-2 border-brand-orange border-t-transparent rounded-full animate-spin"></div>
                                            <span>Processing learning metrics...</span>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* Pantalla de Resultados Finales actualizados */}
                        {gameState === 'results' && (
                            <div className="flex-1 flex flex-col items-center justify-center animate-in zoom-in duration-500 overflow-y-auto py-10 pr-1">
                                <div className="bg-white p-8 md:p-12 rounded-[3.5rem] shadow-2xl border border-slate-100 max-w-2xl w-full text-center space-y-8 relative overflow-hidden">
                                    <div className="absolute top-0 left-0 w-full h-3 bg-brand-orange"></div>
                                    
                                    <div className="space-y-4">
                                        <div className={`mx-auto w-24 h-24 rounded-3xl flex items-center justify-center border-2 shadow-xl ${getGrade().color}`}>
                                            <Icon name={getGrade().icon} className="w-14 h-14" />
                                        </div>
                                        <h2 className="text-3xl md:text-4xl font-black tracking-tighter uppercase italic text-brand-blue">
                                            {getGrade().label}
                                        </h2>
                                    </div>

                                    {/* Grid de Métricas Contrastado */}
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="bg-slate-50 p-6 rounded-3xl border border-slate-200 flex flex-col justify-center">
                                            <p className="text-[10px] font-black text-slate-400 uppercase mb-1 tracking-widest">Final Mode Score</p>
                                            <p className="text-xl sm:text-2xl font-black text-brand-orange">
                                                {score} / {maxPossibleScore} pts
                                            </p>
                                        </div>
                                        <div className="bg-slate-50 p-6 rounded-3xl border border-slate-200 flex flex-col justify-center">
                                            <p className="text-[10px] font-black text-slate-400 uppercase mb-1 tracking-widest">Accuracy Rate</p>
                                            <p className="text-3xl font-black text-brand-blue">
                                                {maxPossibleScore > 0 ? Math.round((score/maxPossibleScore) * 100) : 0}%
                                            </p>
                                        </div>
                                    </div>

                                    {/* Chat Recap / Historial de Interacciones (Diseño elástico robusto) */}
                                    <div className="bg-slate-50 border border-slate-200 p-5 sm:p-6 rounded-[2.5rem] text-left space-y-4 overflow-hidden">
                                        <div className="border-b border-slate-200 pb-2">
                                            <h3 className="text-base font-black text-brand-blue uppercase tracking-tight flex items-center gap-2">
                                                <Icon name="history" className="w-4 h-4 text-brand-orange" />
                                                Historial de Interacciones / Chat Recap
                                            </h3>
                                            <p className="text-xs text-slate-500 font-medium">
                                                Repasa cronológicamente el flujo de tu conversación y las alertas de soporte durante la simulación:
                                            </p>
                                        </div>
                                        
                                        <div className="space-y-4 max-h-[300px] overflow-y-auto pr-2">
                                            {chatHistory.map((msg, i) => {
                                                const translatedTextFeedback = translateFeedbackText(msg.feedback);
                                                const isSuboptimalAgent = msg.type === 'agent' && typeof msg.points === 'number' && msg.points < 10;
                                                
                                                return (
                                                    <div key={i} className={`flex flex-col gap-1.5 p-4 rounded-2xl shadow-sm border overflow-hidden ${
                                                        msg.type === 'customer' 
                                                            ? 'bg-white border-slate-100 ml-0 mr-8' 
                                                            : msg.type === 'agent' 
                                                                ? 'bg-brand-blue text-white border-brand-blue/15 ml-8 mr-0' 
                                                                : 'bg-rose-50 border-rose-100 mx-4'
                                                    }`}>
                                                        <div className="flex justify-between items-center w-full">
                                                            <span className={`text-[9px] font-black uppercase tracking-wider ${
                                                                msg.type === 'customer' 
                                                                    ? 'text-brand-orange' 
                                                                    : msg.type === 'agent' 
                                                                        ? 'text-brand-orangeLight' 
                                                                        : 'text-rose-600'
                                                            }`}>
                                                                {msg.type === 'customer' ? '🗣️ CLIENTE' : msg.type === 'agent' ? '🎧 AGENTE' : '⚠️ SISTEMA / SLA'}
                                                            </span>
                                                            
                                                            {isSuboptimalAgent && (
                                                                <span className="flex items-center gap-1 text-[9px] font-black text-rose-500 bg-rose-50 px-2 py-0.5 rounded-full border border-rose-200">
                                                                    <Icon name="x-circle" className="w-3 h-3 text-rose-500 flex-shrink-0" />
                                                                    Subóptimo ({msg.points} pts)
                                                                </span>
                                                            )}
                                                        </div>
                                                        
                                                        <p className="text-xs font-medium leading-relaxed break-words">
                                                            {msg.text}
                                                        </p>
                                                        
                                                        {/* Tarjeta de corrección del Chat Recap elástica ante textos extensos */}
                                                        {isSuboptimalAgent && translatedTextFeedback && (
                                                            <div className="mt-2 bg-rose-50 border border-rose-100 text-rose-700 p-3.5 rounded-xl break-words whitespace-normal overflow-hidden max-w-full">
                                                                <div className="flex items-center gap-1 mb-1.5">
                                                                    <Icon name="alert-triangle" className="w-3.5 h-3.5 text-rose-500 flex-shrink-0" />
                                                                    <span className="text-[10px] font-black text-rose-600 uppercase tracking-widest">
                                                                        ÁREA DE MEJORA / CORRECCIÓN:
                                                                    </span>
                                                                </div>
                                                                <p className="text-xs font-semibold leading-relaxed break-words whitespace-normal max-w-full">
                                                                    {translatedTextFeedback}
                                                                </p>
                                                            </div>
                                                        )}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>

                                    {/* Resumen de Vocabulario en Azul Oscuro E4CC */}
                                    <div className="bg-brand-blue p-8 rounded-[2.5rem] shadow-xl text-white text-left space-y-6">
                                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-white/10 pb-4">
                                            <div className="flex items-center gap-2">
                                                <Icon name="book-open" className="w-6 h-6 text-brand-orange" />
                                                <h3 className="text-lg font-black uppercase tracking-widest italic">Vocab Summary for Notebook</h3>
                                            </div>
                                            <button 
                                                onClick={() => { 
                                                    const text = vocabularyLog.map(v => {
                                                        let entry = `${v.word.toUpperCase()}\nMeaning: ${v.meaning}`;
                                                        if (v.examples && v.examples.length > 0) {
                                                            entry += `\n` + v.examples.map(ex => `Ex: ${ex}`).join('\n');
                                                        }
                                                        return entry;
                                                    }).join('\n---\n'); 
                                                    
                                                    const el = document.createElement('textarea');
                                                    el.value = text;
                                                    document.body.appendChild(el);
                                                    el.select();
                                                    document.execCommand('copy');
                                                    document.body.removeChild(el);
                                                }} 
                                                className="bg-brand-orange hover:bg-brand-orangeMed px-4 py-2.5 rounded-xl text-[10px] font-black tracking-wider transition-all flex items-center justify-center gap-2 shadow-md uppercase"
                                            >
                                                <Icon name="copy" className="w-3.5 h-3.5" /> 
                                                COPY LIST
                                            </button>
                                        </div>

                                        {vocabularyLog.length > 0 ? (
                                            <div className="space-y-6 max-h-[250px] overflow-y-auto pr-2 scrollbar-thin">
                                                {vocabularyLog.map((item, idx) => (
                                                    <div key={idx} className="space-y-2 border-b border-white/5 pb-4 last:border-0 last:pb-0">
                                                        <div className="flex justify-between items-center">
                                                            <p className="text-brand-orange font-black uppercase text-lg tracking-tight">{item.word}</p>
                                                            {item.isLive && (
                                                                <span className="text-[8px] bg-slate-700 text-slate-300 font-bold tracking-widest uppercase px-1.5 py-0.5 rounded">
                                                                    Live Dict
                                                                </span>
                                                            )}
                                                        </div>
                                                        <p className="text-xs font-medium text-slate-300 leading-relaxed">{item.meaning}</p>
                                                        {item.examples && item.examples.length > 0 && (
                                                            <div className="space-y-1 pl-3 border-l-2 border-brand-orange/60">
                                                                {item.examples.map((ex, i) => (
                                                                    <p key={i} className="text-[10px] italic text-brand-orangeLight/80">"{ex}"</p>
                                                                ))}
                                                            </div>
                                                        )}
                                                    </div>
                                                ))}
                                            </div>
                                        ) : (
                                            <p className="text-center text-slate-400 font-bold italic py-8 uppercase text-xs tracking-wider">
                                                No vocabulary terms consulted in this session.
                                            </p>
                                        )}
                                    </div>

                                    {/* Botón para Reiniciar */}
                                    <button 
                                        onClick={() => setGameState('menu')} 
                                        className="w-full bg-brand-orange hover:bg-brand-orangeMed text-white font-black py-4 rounded-2xl transition-all uppercase text-xs tracking-widest shadow-lg"
                                    >
                                        Back to Main Menu
                                    </button>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
